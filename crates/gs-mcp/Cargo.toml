[package]
name = "gs-mcp"
version.workspace = true
edition.workspace = true
publish = false
description = "stdio MCP server: registry-generated tools + editor bus (MASTER 10.4 / T8.1)"

[[bin]]
name = "gs-mcp"
path = "src/main.rs"

[dependencies]
gs-cli = { path = "../gs-cli" }
gs-registry = { path = "../gs-registry" }
rmcp = { version = "=3.1.2", features = ["server", "macros", "transport-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[dev-dependencies]
gs-editor = { path = "../gs-editor" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time"] }
