[package]
name = "gs-render2d"
version.workspace = true
edition.workspace = true
publish = false
description = "2D sprite renderer: RenderSnapshot IR → offscreen / eframe / winit"

[[bin]]
name = "offscreen"
path = "src/bin/offscreen.rs"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
egui = "=0.31.1"
egui-wgpu = "=0.31.1"
image = { version = "0.25.6", default-features = false, features = ["png"] }
pollster = "0.4.0"
thiserror = { workspace = true }
wgpu = { version = "24.0.3", features = ["wgsl", "dx12", "metal", "vulkan-portability"] }
