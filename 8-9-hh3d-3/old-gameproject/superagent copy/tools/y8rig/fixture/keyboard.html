<!doctype html>
<meta charset="utf-8">
<title>Y8 rig keyboard fixture</title>
<style>
  :root { color-scheme: dark; font: 20px system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16202b; }
  main { width: min(70vw, 760px); padding: 32px; border: 2px solid #90caf9; border-radius: 14px; background: #26384a; }
  #status { color: #ffe082; min-height: 1.5em; }
  #box { margin-top: 20px; height: 110px; border-radius: 10px; background: #4fc3f7; transition: transform 80ms linear; }
</style>
<main tabindex="0">
  <h1>Neutral keyboard fixture</h1>
  <p>This local page belongs to the measurement rig and contains no reference code.</p>
  <div id="status">Click the panel, then send a key.</div>
  <div id="box" aria-hidden="true"></div>
</main>
<script>
  const panel = document.querySelector('main');
  const status = document.querySelector('#status');
  const box = document.querySelector('#box');
  const held = new Set();
  let offset = 0;
  function render(event) {
    const key = event.key || event.code;
    status.textContent = `${event.type}: ${key}`;
    if (event.type === 'keydown') held.add(key);
    if (event.type === 'keyup') held.delete(key);
    offset += event.type === 'keydown' && key === 'ArrowRight' ? 12 : 0;
    offset -= event.type === 'keydown' && key === 'ArrowLeft' ? 12 : 0;
    box.style.transform = `translateX(${offset}px)`;
  }
  panel.addEventListener('keydown', render);
  panel.addEventListener('keyup', render);
  panel.addEventListener('click', () => panel.focus());
</script>
