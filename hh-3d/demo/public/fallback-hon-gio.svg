<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Hòn Gió - sơ đồ địa danh tĩnh</title>
  <desc id="desc">Sơ đồ tĩnh của diorama ven biển Hòn Gió khi WebGL không khả dụng. Địa danh gồm Hải đăng sọc, Bến gỗ, Thúng neo và Nhà mái ngói.</desc>
  <rect width="960" height="540" fill="#8ec9c4"/>
  <rect y="300" width="960" height="240" fill="#6eb8b4"/>
  <rect x="250" y="210" width="460" height="130" rx="18" fill="#e8d5b5"/>
  <rect x="310" y="170" width="340" height="70" rx="14" fill="#c9d5a8"/>
  <rect x="380" y="130" width="200" height="55" rx="10" fill="#d8c49a"/>
  <rect x="620" y="70" width="28" height="90" fill="#f4f0ea"/>
  <rect x="620" y="88" width="28" height="16" fill="#d46a6a"/>
  <rect x="620" y="120" width="28" height="16" fill="#d46a6a"/>
  <rect x="180" y="300" width="220" height="18" fill="#8b5a3c"/>
  <ellipse cx="200" cy="330" rx="28" ry="12" fill="#c47a48"/>
  <rect x="420" y="188" width="36" height="28" fill="#f2ece3"/>
  <rect x="414" y="176" width="48" height="14" fill="#c45c4a"/>
  <rect x="480" y="188" width="32" height="26" fill="#f2ece3"/>
  <rect x="474" y="178" width="44" height="12" fill="#c45c4a"/>
  <text x="40" y="48" fill="#1d2a2e" font-family="Georgia, serif" font-size="28">Hòn Gió</text>
  <text x="40" y="78" fill="#355055" font-family="Segoe UI, sans-serif" font-size="16">Sơ đồ địa danh khi chế độ 3D chưa thể mở</text>
  <text x="40" y="400" fill="#1d2a2e" font-family="Segoe UI, sans-serif" font-size="15">Hải đăng sọc - tháp đèn trắng đỏ trên mỏm cao.</text>
  <text x="40" y="426" fill="#1d2a2e" font-family="Segoe UI, sans-serif" font-size="15">Bến gỗ - cầu gỗ nhỏ nối đảo với mặt nước.</text>
  <text x="40" y="452" fill="#1d2a2e" font-family="Segoe UI, sans-serif" font-size="15">Thúng neo - chiếc thúng tròn nằm cạnh bến.</text>
  <text x="40" y="478" fill="#1d2a2e" font-family="Segoe UI, sans-serif" font-size="15">Nhà mái ngói - những căn nhà nhỏ trên bậc cỏ.</text>
  <text x="40" y="514" fill="#355055" font-family="Segoe UI, sans-serif" font-size="14">Để tiếp tục: bật WebGL rồi mở chế độ 3D. Kéo để xoay, cuộn để zoom, chọn địa danh hoặc Toàn cảnh.</text>
</svg>
