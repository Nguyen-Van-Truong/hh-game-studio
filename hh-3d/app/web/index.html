<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; font-src 'self';"
    />
    <title>HH World</title>
  </head>
  <body>
    <div id="root">
      <div class="play-boot" data-testid="play-boot" role="status">
        <p class="play-boot-brand">HH World</p>
        <div class="play-boot-road" aria-hidden="true"></div>
        <p class="play-boot-title">Loading the authored 400 m block</p>
        <p class="play-boot-copy">
          Ground, buildings, and your character. Authored approximation — not a
          city, not OSM, not 1:1.
        </p>
      </div>
    </div>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #d8d3c8;
        color: #3a3d42;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .play-boot {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        padding: 1.5rem;
        text-align: center;
      }
      .play-boot-brand {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 650;
      }
      .play-boot-road {
        width: min(22rem, 72vw);
        height: 0.65rem;
        margin: 0.35rem 0 0.15rem;
        background: #3a3d42;
        border-radius: 2px;
      }
      .play-boot-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 650;
      }
      .play-boot-copy {
        margin: 0;
        max-width: 28rem;
        font-size: 0.86rem;
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
