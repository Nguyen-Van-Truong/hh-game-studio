[package]
name = "render-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "M-1-a spike: one RenderSnapshot IR → eframe viewport / winit player / offscreen PNG"

[[bin]]
name = "viewport"
path = "src/bin/viewport.rs"

[[bin]]
name = "player"
path = "src/bin/player.rs"

[[bin]]
name = "offscreen"
path = "src/bin/offscreen.rs"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "=0.31.1"
egui-wgpu = "=0.31.1"
image = { version = "0.25.6", default-features = false, features = ["png"] }
pollster = "0.4.0"
wgpu = { version = "24.0.3", features = ["wgsl", "dx12", "metal", "vulkan-portability"] }
winit = "0.30.9"
