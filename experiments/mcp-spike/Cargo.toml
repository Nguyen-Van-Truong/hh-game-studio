[package]
name = "mcp-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "M-1e spike: MCP hello + gs_command echo (stdio). Not production."

[dependencies]
rmcp = { version = "=3.1.2", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time"] }
