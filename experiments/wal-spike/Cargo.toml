[package]
name = "wal-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "M-1-c WAL crash / fault-injection POC (replayable full command+inverse)"

[dependencies]
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
