[workspace]
resolver = "2"
members = [
    "crates/gs-registry",
    "crates/gs-protocol",
    "crates/gs-scene",
    "crates/gs-editor",
    "crates/gs-cli",
    "crates/gs-mcp",
    "crates/gs-render2d",
    "crates/gs-runtime-core",
    "crates/gs-player",
    "crates/gs-jobs",
    "tests/m0",
    "tests/m1",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
crc32fast = "1"
fs2 = "0.4"
ryu = "1"
